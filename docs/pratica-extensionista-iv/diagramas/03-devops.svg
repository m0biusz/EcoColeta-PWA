<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54717D"/></marker><marker id="dependency" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#54717D" stroke-width="1.4"/></marker><marker id="return" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B25C4F"/></marker></defs><rect width="100%" height="100%" fill="#FAFCFB"/><text x="35" y="45" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#087E77" font-weight="700" text-anchor="start">03   ARQUITETURA DEVOPS</text><text x="35" y="75" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#54717D" font-weight="400" text-anchor="start">Fluxo planejado de integração, revisão e publicação</text><rect x="35" y="150" width="210" height="95" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="53" y="177" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">Desenvolvedor</text><text x="53" y="206" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Branch e commit</text><rect x="320" y="150" width="210" height="95" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="338" y="177" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">GitHub</text><text x="338" y="206" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Push / pull request</text><rect x="605" y="150" width="210" height="95" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="623" y="177" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">GitHub Actions</text><text x="623" y="206" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Lint, testes, build</text><rect x="890" y="150" width="180" height="95" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="908" y="177" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">Revisão</text><text x="908" y="206" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Checks + aprovação</text><path d="M245,195 L320,195" fill="none" stroke="#54717D" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M530,195 L605,195" fill="none" stroke="#54717D" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M815,195 L890,195" fill="none" stroke="#54717D" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="425" y="365" width="255" height="100" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="443" y="392" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">Vercel Preview</text><text x="443" y="421" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">URL para validar PR</text><rect x="785" y="365" width="285" height="100" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="803" y="392" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">Vercel Produção</text><text x="803" y="421" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Merge na main → deploy</text><path d="M425,245 L510,365" fill="none" stroke="#54717D" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="402.5" y="280.0" width="130" height="23" fill="#FAFCFB"/><text x="467.5" y="297.0" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#54717D" font-weight="400" text-anchor="middle">integração Git</text><path d="M980,245 L925,365" fill="none" stroke="#54717D" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="887.5" y="280.0" width="130" height="23" fill="#FAFCFB"/><text x="952.5" y="297.0" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#54717D" font-weight="400" text-anchor="middle">merge</text><path d="M680,365 L890,245" fill="none" stroke="#54717D" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="720.0" y="280.0" width="130" height="23" fill="#FAFCFB"/><text x="785.0" y="297.0" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#54717D" font-weight="400" text-anchor="middle">validar prévia</text><path d="M710,150 L710,112 L145,112 L145,150" fill="none" stroke="#B25C4F" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#return)"/><rect x="335" y="87" width="130" height="23" fill="#FAFCFB"/><text x="400" y="104" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#B25C4F" font-weight="400" text-anchor="middle">Falha → corrigir branch</text><text x="35" y="525" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Falha nos checks → correção na branch → nova execução. O deploy depende de criar e conectar o projeto Vercel.</text><text x="35" y="552" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Alterações de banco: migrations versionadas, revisadas e aplicadas de modo controlado no Supabase.</text></svg>