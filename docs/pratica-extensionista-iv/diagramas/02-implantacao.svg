<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#54717D"/></marker></defs><rect width="100%" height="100%" fill="#FAFCFB"/><text x="35" y="45" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#087E77" font-weight="700" text-anchor="start">02   ARQUITETURA DE IMPLANTAÇÃO</text><text x="35" y="75" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#54717D" font-weight="400" text-anchor="start">Nós de execução, artefatos implantados e comunicação</text><rect x="35" y="175" width="285" height="260" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="52" y="203" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#087E77" font-weight="700" text-anchor="start">«device»</text><text x="53" y="230" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">Dispositivo do cidadão</text><text x="53" y="259" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Navegador web</text><text x="53" y="283" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">«artifact» EcoColeta PWA</text><text x="53" y="307" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Service worker + cache local</text><text x="53" y="331" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Geolocalização com permissão</text><rect x="408" y="175" width="285" height="260" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="425" y="203" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#087E77" font-weight="700" text-anchor="start">«node»</text><text x="426" y="230" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">Vercel / CDN</text><text x="426" y="259" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Hosting estático</text><text x="426" y="283" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">«artifact» build React + Vite</text><text x="426" y="307" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Arquivos estáticos via HTTPS</text><text x="426" y="331" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Deploy por integração Git</text><rect x="781" y="135" width="285" height="330" rx="12" fill="#FFFFFF" stroke="#087E77" stroke-width="2"/><text x="798" y="163" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#087E77" font-weight="700" text-anchor="start">«node»</text><text x="799" y="190" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#132B3A" font-weight="700" text-anchor="start">Supabase Cloud</text><text x="799" y="219" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Serviços gerenciados</text><text x="799" y="243" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Auth + API / PostgREST</text><text x="799" y="267" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">PostgreSQL (RLS)</text><text x="799" y="291" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Storage de fotos (políticas)</text><text x="799" y="315" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#54717D" font-weight="400" text-anchor="start">Projeto cloud a provisionar</text><path d="M320,220 L408,220" fill="none" stroke="#54717D" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="299.0" y="195.0" width="130" height="23" fill="#FAFCFB"/><text x="364.0" y="212.0" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#54717D" font-weight="400" text-anchor="middle">HTTPS</text><path d="M200,435 L200,490 L905,490 L905,465" fill="none" stroke="#54717D" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="475" y="466" width="130" height="23" fill="#FAFCFB"/><text x="540" y="483" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#54717D" font-weight="400" text-anchor="middle">HTTPS / API</text><text x="35" y="540" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#54717D" font-weight="400" text-anchor="start">A PWA chama a API/Auth/Storage diretamente pelo navegador; Vercel entrega os arquivos da aplicação.</text><text x="35" y="568" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#54717D" font-weight="400" text-anchor="start">Sem internet: apenas dados públicos previamente armazenados; novos relatos exigem conexão.</text></svg>